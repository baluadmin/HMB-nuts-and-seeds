name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          python3-pip \
          ccache \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer
        pip install "Cython==0.29.36"

    - name: Clean Previous Build
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HMB-Nuts-Spices-APK
        path: bin/*.apk
